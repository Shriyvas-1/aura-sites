<!DOCTYPE html>

    <title>Lando Norris Style Website</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Merriweather', serif, sans-serif;
            line-height: 1.6;
            font-size: 16px;
            color: #363636;
            background-color: #f4f4f4;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #363636;
        }

        nav {
            display: flex;
            list-style: none;
        }

        nav li {
            margin-left: 20px;
        }

        nav a {
            text-decoration: none;
            color: #363636;
            transition: color 250ms ease-in-out;
        }

        nav a:hover {
            color: #ff7c43;
        }

        main {
            margin-top: 40px;
        }

        main section {
            margin-bottom: 40px;
        }

        section header {
            margin-bottom: 20px;
        }

        section header h2 {
            font-size: 2.5rem;
            color: #363636;
            font-weight: bold;
        }

        section p {
            font-size: 1.1rem;
            color: #363636;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .social {
            display: flex;
            list-style: none;
        }

        .social li {
            margin-left: 10px;
        }

        .social a {
            text-decoration: none;
            color: #363636;
            transition: color 250ms ease-in-out;
        }

        .social a:hover {
            color: #ff7c43;
        }
    </styles>
